<!DOCTYPE html>
<html lang="zh-CN" data-mode="light" data-accent="cinnabar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卷帙 Quire</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/views.css">
</head>
<body>
<div class="app" id="app">
  <!-- ================= 侧栏 ================= -->
  <aside class="sb" aria-label="导航">
    <div class="sb-top">
      <span class="brand">卷帙<small>Quire</small></span>
      <button class="btn quiet icon-btn" id="paletteBtn" aria-label="命令面板 ⌘K" title="⌘K">
        <svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      </button>
    </div>
    <div class="sb-scroll">
      <nav class="sb-nav">
        <button class="nav" data-go="capture" title="⌘N"><svg class="i" viewBox="0 0 16 16"><path d="M8 2.5v8M4.8 7.3 8 10.5l3.2-3.2"/><path d="M2.5 11v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11"/></svg><span>采集</span></button>
        <button class="nav" data-go="library" data-group="all" title="⌘1"><svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="3" height="11" rx=".6"/><rect x="6.5" y="2.5" width="3" height="11" rx=".6"/><path d="m11 3.2 2.6-.7 2 10.6"/></svg><span>书库</span><span class="count num" id="cntAll"></span></button>
        <button class="nav" data-go="tasks" title="⌘2"><svg class="i" viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h6"/></svg><span>任务</span><span class="badge num" id="taskBadge" hidden></span><span class="qdot" id="runDot" hidden></span></button>
      </nav>
      <div class="sb-groups">
        <div class="sb-label">书架</div>
        <nav class="sb-nav">
          <button class="nav" data-go="library" data-group="updates"><span class="dot" style="background:var(--accent)"></span><span>有更新</span><span class="count num" id="cntUpd"></span></button>
          <button class="nav" data-go="library" data-group="following"><svg class="i" viewBox="0 0 16 16"><path d="M8 13.2 3.3 8.6a2.8 2.8 0 0 1 4-4L8 5.3l.7-.7a2.8 2.8 0 0 1 4 4Z"/></svg><span>追更中</span><span class="count num" id="cntFol"></span></button>
        </nav>
        <div class="sb-label">分组 <button id="addGroupBtn" aria-label="新建分组" title="新建分组">＋</button></div>
        <nav class="sb-nav" id="groupNav" aria-label="分组"></nav>
      </div>
    </div>
    <div class="sb-foot">
      <button class="mini-job" id="miniJob" hidden data-go="tasks"></button>
      <button class="nav" data-go="settings" title="⌘,"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/></svg><span>设置</span></button>
    </div>
  </aside>

  <!-- ================= 内容 ================= -->
  <main class="main">

    <!-- 采集 -->
    <section class="view" data-view="capture" aria-labelledby="capTitle">
      <div class="toolbar"><h1 id="capTitle">采集</h1><div class="grow"></div>
        <button class="btn quiet" id="resetCap" hidden>重新开始</button></div>
      <div class="scroll" id="capScroll">
        <div class="capture" id="capture">
          <div class="cap-hero"><h2>收一本书进来</h2><p>粘贴作品目录页或章节页的链接，类型和章节会自动识别</p></div>
          <form class="omni" id="omniForm" role="search">
            <svg class="i" viewBox="0 0 16 16"><path d="M6.6 9.4 9.4 6.6M7.2 4.2l1.2-1.2a2.8 2.8 0 0 1 4 4l-1.2 1.2M8.8 11.8l-1.2 1.2a2.8 2.8 0 0 1-4-4l1.2-1.2"/></svg>
            <label class="sr" for="urlIn">作品链接</label>
            <input id="urlIn" placeholder="https://" autocomplete="off" spellcheck="false" inputmode="url">
            <button type="button" class="btn quiet" id="pasteBtn">粘贴 <span class="kbd">⌘V</span></button>
            <button class="btn primary" id="probeBtn" disabled>识别</button>
          </form>
          <ol class="steps" id="steps" hidden aria-live="polite">
            <li data-s="fetch">连接站点</li><li data-s="parse">读取目录</li><li data-s="estimate">抽样估算体积</li>
          </ol>
          <div id="capErr"></div>
          <div id="result"></div>
          <div id="capHome">
            <div class="sites" id="sitesBox" hidden><h3>从这些站点找书</h3><div class="site-grid" id="siteGrid"></div></div>
          </div>
        </div>
      </div>
      <div class="dock" id="dock" hidden><div class="dock-in">
        <div class="sum num" id="dockSum" aria-live="polite"></div>
        <button class="btn primary lg" id="startBtn">开始采集 <span class="kbd">⌘↵</span></button>
      </div></div>
    </section>

    <!-- 书库 -->
    <section class="view" data-view="library" hidden aria-labelledby="libTitle">
      <div class="toolbar" id="libBar">
        <h1 id="libTitle">书库</h1><span class="sub num" id="libSub"></span>
        <div class="grow"></div>
        <div class="search"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <label class="sr" for="libSearch">搜索书名或作者</label><input id="libSearch" placeholder="搜索书名、作者" autocomplete="off"></div>
        <div class="seg" role="group" aria-label="显示方式" id="layoutSeg">
          <button aria-pressed="true" data-layout="grid" aria-label="封面" title="封面"><svg class="i" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg></button>
          <button aria-pressed="false" data-layout="list" aria-label="列表" title="列表"><svg class="i" viewBox="0 0 16 16"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h0M2.5 8h0M2.5 12h0"/></svg></button>
        </div>
        <button class="btn quiet" id="checkAll" hidden><svg class="i" viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.8v2.6h-2.6"/></svg><span id="checkAllTxt">检查更新</span></button>
      </div>
      <div class="lib-wrap" id="libWrap">
        <div class="scroll" id="libScroll"><div id="libMsg"></div><div id="shelf"></div></div>
        <aside class="insp" id="insp" aria-label="书籍详情"><div class="insp-in" id="inspIn"></div></aside>
      </div>
    </section>

    <!-- 任务 -->
    <section class="view" data-view="tasks" hidden aria-labelledby="taskTitle">
      <div class="toolbar"><h1 id="taskTitle">任务</h1><span class="sub" id="taskSub"></span><div class="grow"></div>
        <button class="btn quiet" id="clearDone" hidden>清除已结束</button></div>
      <div class="tasks" id="tasksWrap">
        <div class="tlist" id="tlist" role="list" aria-label="任务列表"></div>
        <div class="tdetail" id="tdetail"></div>
      </div>
    </section>

    <!-- 设置 -->
    <section class="view" data-view="settings" hidden aria-labelledby="setTitle">
      <div class="toolbar"><h1 id="setTitle">设置</h1><div class="grow"></div><span class="saved" id="saved" role="status"><i></i><span id="savedTxt">已保存</span></span></div>
      <div class="scroll"><div class="settings" id="settings">
        <h3>外观</h3>
        <div class="group">
          <div class="srow"><div class="txt"><span class="lab">明暗</span></div>
            <div class="appear" id="appear" role="group" aria-label="明暗">
              <button data-mode-set="light" aria-pressed="false"><div class="sw" style="background:#F7F6F3"><i style="background:#EFEDE8"></i></div>浅色</button>
              <button data-mode-set="dark" aria-pressed="false"><div class="sw" style="background:#151413"><i style="background:#1B1A18"></i></div>深色</button>
              <button data-mode-set="system" aria-pressed="false"><div class="sw" style="background:linear-gradient(135deg,#F7F6F3 50%,#151413 50%)"><i style="background:transparent"></i></div>跟随系统</button>
            </div></div>
          <div class="srow"><div class="txt"><span class="lab">强调色</span></div>
            <div class="accents" id="accents" role="group" aria-label="强调色">
              <button style="background:#B0402F;color:#B0402F" data-accent-set="cinnabar" aria-pressed="false" aria-label="朱砂" title="朱砂"></button>
              <button style="background:#2F5D8A;color:#2F5D8A" data-accent-set="indigo" aria-pressed="false" aria-label="青黛" title="青黛"></button>
              <button style="background:#1D1B18;color:#1D1B18" data-accent-set="ink" aria-pressed="false" aria-label="墨" title="墨"></button>
            </div></div>
        </div>
        <h3>输出</h3>
        <div class="group">
          <div class="srow"><div class="txt"><label for="setOutput">保存位置</label><div class="field-err" id="errOutput" hidden></div></div>
            <input class="field-input path-in" id="setOutput" spellcheck="false" data-key="output_dir"><button class="btn" id="browseOutputBtn" hidden>更改…</button></div>
          <div class="srow"><div class="txt"><span class="lab">漫画默认画质</span><small id="qDesc"></small></div>
            <div class="seg" id="qSeg" role="group" aria-label="漫画默认画质"><button aria-pressed="false" data-v="archive">原画</button><button aria-pressed="false" data-v="balanced">均衡</button><button aria-pressed="false" data-v="small">压缩</button></div></div>
          <div class="srow"><div class="txt"><label for="setTaskNovel">单本体积上限</label><small>超出时自动降低画质或分卷；原画不受限</small><div class="field-err" id="errTask" hidden></div></div>
            <span class="unit" style="margin:0">小说</span><input class="field-input sm num" id="setTaskNovel" inputmode="numeric" data-key="task_novel_mb"><span class="unit">MB</span>
            <span class="unit" style="margin:0 0 0 8px">漫画</span><input class="field-input sm num" id="setTaskManga" aria-label="漫画体积上限" inputmode="numeric" data-key="task_manga_mb"><span class="unit">MB</span></div>
        </div>
        <h3>网络</h3>
        <div class="group">
          <div class="srow"><div class="txt"><label for="setConcurrency">同时下载</label><small>1–32；遇到站点限流时调低</small><div class="field-err" id="errConcurrency" hidden></div></div><input class="field-input sm num" id="setConcurrency" inputmode="numeric" data-key="concurrency"></div>
          <div class="srow"><div class="txt"><label for="setRate">每站请求上限</label><small>0–10 次/秒</small><div class="field-err" id="errRate" hidden></div></div><input class="field-input sm num" id="setRate" inputmode="decimal" data-key="rate"><span class="unit">次/秒</span></div>
          <div class="srow"><div class="txt"><label for="setRobots">遵守 robots.txt</label><small>无法获取时按不限制处理</small></div><input type="checkbox" class="switch" id="setRobots" data-key="obey_robots"></div>
          <div class="srow"><div class="txt"><label for="setBrowserNative">使用真实浏览器</label><small>用于需要登录或反爬严格的站点</small></div><input type="checkbox" class="switch" id="setBrowserNative" data-key="browser_native"></div>
          <div class="srow" id="cdpRow" hidden><div class="txt"><label for="setCdpEndpoint">已登录 Chrome 的调试地址</label><small>留空则使用内置隔离浏览器</small><div class="field-err" id="errCdp" hidden></div></div><input class="field-input" id="setCdpEndpoint" placeholder="http://127.0.0.1:9222" style="width:220px" spellcheck="false" data-key="cdp_endpoint"></div>
        </div>
        <h3>文字识别</h3>
        <div class="group">
          <div class="srow"><div class="txt"><span class="lab">图片正文</span><small>正文是图片的小说才需要</small></div>
            <div class="seg" id="ocrSeg" role="group" aria-label="图片正文识别"><button aria-pressed="false" data-v="auto">自动</button><button aria-pressed="false" data-v="always">总是</button><button aria-pressed="false" data-v="never">关闭</button></div></div>
          <div class="srow"><div class="txt"><span class="lab">OCR 模块</span><small id="ocrModuleStatus">正在检查…</small></div>
            <div class="meter" id="ocrMeter" hidden><i id="ocrMeterFill"></i></div><button class="btn" id="ocrDownloadBtn" hidden>下载模型（约 16 MB）</button></div>
        </div>
        <h3>追更</h3>
        <div class="group">
          <div class="srow"><div class="txt"><label for="setAutoCheck">启动时检查更新</label><small>只检查已登记追更的书</small></div><input type="checkbox" class="switch" id="setAutoCheck" data-key="auto_check_updates"></div>
        </div>
        <h3>关于</h3>
        <div class="group" id="aboutGroup"></div>
      </div></div>
    </section>
  </main>
</div>

<dialog id="palette" aria-label="命令面板"><div class="palette">
  <div class="omni"><svg class="i" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
    <label class="sr" for="palIn">搜索书籍、命令，或粘贴链接</label>
    <input id="palIn" placeholder="搜索书籍、命令，或粘贴链接" autocomplete="off" role="combobox" aria-controls="palList" aria-expanded="true"><span class="kbd">esc</span></div>
  <ul id="palList" role="listbox"></ul>
</div></dialog>
<dialog id="confirm" aria-labelledby="confirmTitle"><div class="confirm" id="confirmIn"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastTxt"></span><button id="toastAct" hidden></button></div>

<script src="/static/app.js"></script>
<script src="/static/covers.js"></script>
<script src="/static/follows.js"></script>
<script src="/static/chapters.js"></script>
<script src="/static/capture.js"></script>
<script src="/static/run-events.js"></script>
<script src="/static/tasks.js"></script>
<script src="/static/queue-status.js"></script>
<script src="/static/library.js"></script>
<script src="/static/inspector.js"></script>
<script src="/static/settings.js"></script>
<script src="/static/palette.js"></script>
</body>
</html>
