[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quire-local"
version = "0.0.1"
description = "Quire local manga and novel collector"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
core = ["httpx>=0.28,<0.29", "Pillow>=10.4,<13"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1", "mypy>=1.11,<2", "Pillow>=10.4,<13", "pypdf>=5,<7", "lxml>=5,<7"]

[project.scripts]
quire = "quire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "T20"]

[tool.mypy]
strict = true
files = ["src/quire"]

[tool.coverage.run]
source = ["quire"]

[tool.coverage.report]
show_missing = true
