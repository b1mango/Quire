name: Quire checks
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  micro:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: uv sync --locked --extra dev --extra core --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/quire
      - run: uv run pytest --cov=quire --cov-report=term-missing --cov-report=json:output/coverage.json
      - run: uv run python scripts/check_coverage.py output/coverage.json
      - run: uv run python scripts/build_micro_zipapp.py
      - run: uv run python -S dist/quire.pyz doctor
      - run: uv run python scripts/smoke_micro.py
      - run: uv run python scripts/smoke_ledger.py
      - run: uv run python scripts/smoke_session.py
      - run: uv run python scripts/smoke_resume.py
      - run: uv run python scripts/smoke_compression.py
      - run: uv run python scripts/smoke_formats.py
      - run: uv run python scripts/measure_core_dependencies.py
      - run: swift scripts/render_pdf.swift output/smoke/quire-sample.pdf output/smoke/page
      - run: swift scripts/render_pdf.swift output/compression-smoke/sample.pdf output/compression-smoke/page
      - run: swift scripts/render_pdf.swift output/formats-smoke/sample.pdf output/formats-smoke/page
      - uses: actions/upload-artifact@v4
        with:
          name: quire-micro
          path: dist/quire.pyz
  dmg:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"
      - run: uv sync --locked --extra dev --extra core --python 3.12
      - run: scripts/build_app.sh
      - run: scripts/make_dmg.sh
      - name: 体积门禁（§23 用户硬指标）
        run: |
          DMG_BYTES=$(stat -f%z dist/quire-*.dmg)
          echo ".app $(($(du -sk dist/quire.app | cut -f1) * 1024)) bytes，.dmg $DMG_BYTES bytes"
          [ "$DMG_BYTES" -le 52428800 ]
      - name: 干净环境安装 .dmg 冒烟（§19.3，仅 tag）
        run: |
          hdiutil attach -nobrowse -readonly dist/quire-*.dmg -mountpoint /tmp/quire-mnt
          mkdir -p /tmp/quire-install
          cp -R /tmp/quire-mnt/quire.app /tmp/quire-install/
          hdiutil detach /tmp/quire-mnt
          xattr -dr com.apple.quarantine /tmp/quire-install/quire.app 2>/dev/null || true
          scripts/smoke_app.sh /tmp/quire-install/quire.app
      - uses: actions/upload-artifact@v4
        with:
          name: quire-dmg
          path: dist/quire-*.dmg
